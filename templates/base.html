<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <nav>
    {% if request.user.is_authenticated %}
        <a href="{% url 'accounts' %}">Accounts</a>
        <a href="{% url 'transactions' %}">Transactions</a>
        <a href="{% url 'transaction_create' %}">Create transaction</a>
        <a href="{% url 'transfer' %}">Transfer</a>
        <a href="{% url 'cards' %}">Cards</a>
        <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>

{% block content %}
{% endblock %}
</body>
</html>
